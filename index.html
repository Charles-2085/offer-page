<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checking Available Offers...</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .text {
      font-size: 14px;
      color: #555;
      margin-bottom: 15px;
    }

    .progress {
      width: 100%;
      height: 6px;
      background: #e5e7eb;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    .bar {
      width: 100%;
      height: 100%;
      background: #22c55e;
      animation: load 2s linear forwards;
    }

    @keyframes load {
      from { width: 0%; }
      to { width: 100%; }
    }

    .small {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
    }

    .btn {
      display: block;
      margin-top: 18px;
      background: #2563eb;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>

</head>

<body>
  <div class="card">
    <div class="title">Checking Available Airtime & Data Offers</div>
